# Render blueprint.
#
# The static site rewrites /api/* to the API service, so the browser sees ONE
# origin. That is what lets the refresh token live in a first-party httpOnly
# cookie — cross-site cookies are effectively dead on iOS Safari, and a good
# share of the floor is on iPhone.
#
# The database is NOT declared here. It is a free Render Postgres named
# greenlam-tracker-db that already exists in the workspace, and DATABASE_URL
# references it by name. Render's free tier allows exactly one free Postgres
# per workspace, so declaring one here fails while that instance exists.
#
# READ THIS BEFORE A PILOT: Render's free Postgres is DELETED AFTER 30 DAYS,
# and this one goes on 30 September 2026. It is fine for a synthetic demo and
# nothing else. For anything real, provision Neon and point DATABASE_URL at it
# with `sync: false` so the connection string is pasted in the dashboard.
# Losing a pilot's history the week leadership reviews it is not a recoverable
# mistake (spec §0).
#
# Excel generation is NOT here either. It runs on the GitHub Actions runner
# against Neon directly, via a read-only export_reader role (addendum §0).
# Render stays asleep for it.

services:
  - type: web
    name: greenlam-tracker-api
    runtime: docker
    plan: free
    region: singapore # closest to India; confirm data-residency policy first
    rootDir: api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false # deploy deliberately during a pilot, not on every push
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        # Points at the greenlam-tracker-db instance that already exists in the
        # workspace. Render's free tier allows exactly ONE free Postgres per
        # workspace, so declaring a `databases:` block here fails with "cannot
        # have more than one active free tier database" while that instance
        # exists. Referencing it by name keeps the connection string out of
        # this file and out of the dashboard.
        fromDatabase:
          name: greenlam-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PIN_PEPPER
        generateValue: true # rotating this invalidates every PIN — see README
      - key: COOKIE_SECURE
        value: "true"
      - key: BASE_URL
        # Render has no `url` property for fromService — only connectionString,
        # host, hostport and port — and `host` yields a bare hostname with no
        # scheme, which QR payloads ({BASE_URL}/s/{token}) cannot use. So this
        # is written out in full.
        #
        # It must match the web service's real URL. Render appends a random
        # suffix when a name is already taken globally, so CHECK THIS after the
        # first apply: if the site came up as greenlam-tracker-web-xxxx, fix
        # this value and the rewrite destination below to match. Only QR codes
        # break if it is wrong; the rewrite is the one that breaks sign-in.
        value: https://greenlam-tracker-web.onrender.com
      - key: ALLOW_REMOTE_SEED
        # TRUE ONLY BECAUSE THIS IS THE SYNTHETIC DEMO. The seed refuses to
        # touch a non-local database unless this is set, which is the guard
        # that keeps generated data out of a real plant's history. Set it back
        # to "false" before this blueprint points at anything real.
        #
        # Safe to leave on for the demo: the container runs the seed without
        # --reset, so it fills an empty database once and is a no-op after.
        value: "true"

  - type: web
    name: greenlam-tracker-web
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dashboard/dist
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # Same-origin API. Must come before the SPA catch-all.
      - type: rewrite
        source: /api/*
        destination: https://greenlam-tracker-api.onrender.com/api/*
      # SPA fallback: every other path serves index.html so client routing works.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        # The sha256 is the theme bootstrap script inlined in index.html. It
        # has to run before first paint to avoid a flash of the wrong theme,
        # and hashing it means we never need 'unsafe-inline'.
        # Regenerate after editing that script: npm run csp:hash
        value: >-
          default-src 'self';
          script-src 'self' 'sha256-5razn2Jzw0fWybM3HPB6XWL8YOLU7RZ4AIMLP+K9ygA=';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob:;
          font-src 'self';
          connect-src 'self';
          media-src 'self' blob:;
          object-src 'none';
          base-uri 'none';
          form-action 'self';
          frame-ancestors 'none';
          upgrade-insecure-requests
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /*
        name: Permissions-Policy
        # Camera stays allowed: Phase 3 scans QR labels from this origin.
        value: camera=(self), microphone=(self), geolocation=(), payment=()
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
