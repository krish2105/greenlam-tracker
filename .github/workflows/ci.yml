name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — migration and tests
    runs-on: ubuntu-latest

    # A real Postgres, not SQLite. The schema uses JSONB, partial indexes and
    # CHECK constraints; a SQLite suite would pass while the migration that
    # actually ships was broken.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: greenlam
          POSTGRES_PASSWORD: greenlam
          POSTGRES_DB: greenlam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greenlam"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://greenlam:greenlam@localhost:5432/greenlam_test
      TEST_DATABASE_URL: postgresql+psycopg://greenlam:greenlam@localhost:5432/greenlam_test
      ENV: ci
      JWT_SECRET: ci-secret-not-for-production-padded-to-32b
      PIN_PEPPER: ci-pepper-not-for-production-padded-to-32b
      COOKIE_SECURE: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        working-directory: api
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: api
        run: ruff check app tests

      - name: Migration applies to an empty database
        working-directory: api
        run: alembic upgrade head

      - name: Migration is reversible
        working-directory: api
        run: alembic downgrade base && alembic upgrade head

      - name: Tests
        working-directory: api
        run: pytest -q

  web:
    name: Web — types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Types
        run: npm run typecheck

      - name: Core tests
        run: npm test

      # A missing Hindi key falls back to English and ships silently — one
      # English sentence in the middle of a Hindi screen, which the operator
      # who hits it will never think to report. A dropped {{count}} is worse:
      # the sentence still reads fluently, it just no longer says how many.
      - name: Locales agree
        run: node scripts/check-locales.mjs

      # The inline theme bootstrap is allowlisted in the CSP by hash. If someone
      # edits it and forgets to regenerate, the production page silently loses
      # its theme script — so fail here instead.
      - name: CSP hash is current
        run: npm run csp:hash -- --check

      - run: npm run build
